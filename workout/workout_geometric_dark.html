<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometric Dark Workout Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Base Theme */
        body {
            background: linear-gradient(135deg, #5a5c5f, #333333);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* --- Decorative Geometric Background Elements --- */
        .geo-shape {
            position: absolute;
            z-index: 0;
            pointer-events: none;
        }
        
        /* Hollow Hexagons */
        .hex-bg {
            width: 200px;
            height: 200px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><polygon points="50 2, 93 25, 93 75, 50 98, 7 75, 7 25" fill="none" stroke="%23e09f69" stroke-width="1.5"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0.8;
        }
        .hex-1 { top: 40%; right: -50px; transform: scale(1.5); }
        .hex-2 { bottom: -20px; left: 30%; transform: scale(0.8) rotate(15deg); }
        
        /* Angled Lines */
        .line { background: #e09f69; height: 3px; position: absolute; border-radius: 2px;}
        .line-1 { width: 150px; top: 10%; right: 10%; transform: rotate(-35deg); }
        .line-2 { width: 80px; top: 15%; right: 15%; transform: rotate(-35deg); }
        .line-3 { width: 200px; bottom: 20%; right: -20px; transform: rotate(-35deg); }

        /* Dots */
        .dot { width: 20px; height: 20px; background: #f3dfb3; border-radius: 50%; position: absolute; }
        .dot-1 { top: 20%; right: 10%; }
        .dot-2 { bottom: 30%; left: 40%; transform: scale(0.5); }

        /* --- Main App Container --- */
        #app-container {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 1;
            display: flex;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        /* Pseudo-Fullscreen Fallback Class */
        .pseudo-fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
            border-radius: 0 !important;
            border: none !important;
            z-index: 9999 !important;
        }

        /* --- Top Right Controls --- */
        #top-controls {
            position: absolute;
            top: 20px;
            right: 30px;
            z-index: 30; 
            display: flex;
            gap: 10px;
        }

        .ctrl-btn {
            background: transparent;
            color: #ccc;
            border: 2px solid #aaa;
            font-size: 1.2rem;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ctrl-btn:hover { background: rgba(255,255,255,0.1); color: #fff; border-color: #fff; }
        .active-state { color: #e09f69 !important; border-color: #e09f69 !important; }

        /* --- Left Info Column (Embossed Look) --- */
        #left-column {
            width: 35%;
            padding: 80px 0 0 60px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .embossed-text {
            font-size: 4.5rem;
            font-weight: 700;
            color: #df9e67;
            text-transform: uppercase;
            line-height: 1.1;
            margin: 0;
            /* Recreating the 3D embossed look from the image */
            text-shadow: 
                3px 3px 5px rgba(0,0,0,0.6), 
                -1px -1px 2px rgba(255,255,255,0.2),
                inset 1px 1px 2px rgba(0,0,0,0.5);
            letter-spacing: 2px;
        }

        .embossed-sub {
            font-size: 3rem;
            font-weight: 600;
        }

        /* --- Center/Right Content Area --- */
        #main-content {
            width: 65%;
            padding: 15% 80px 10% 40px;
            display: flex;
            align-items: center;
        }

        #exercise-name {
            font-size: 4.5rem;
            font-weight: 600;
            color: #f3dfb3; /* Pale yellow/cream */
            line-height: 1.3;
            margin: 0;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }
        
        #exercise-name.rest-text {
            color: #ff6b6b;
        }

        /* --- Glowing Timer Box (Bottom Left) --- */
        #timer-box {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 350px;
            height: 200px;
            background: #e8e8e8;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Large glow effect */
            box-shadow: 0 0 60px 30px rgba(232, 232, 232, 0.6);
            border-top-right-radius: 10px;
            z-index: 20;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        #timer-box.warning {
            background: #ffcccc;
            box-shadow: 0 0 60px 30px rgba(255, 107, 107, 0.6);
        }

        /* Subtle hex background inside the timer box */
        #timer-box::after {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><polygon points="50 2, 93 25, 93 75, 50 98, 7 75, 7 25" fill="none" stroke="%23df9e67" stroke-width="0.5"/></svg>');
            background-size: 80px;
            opacity: 0.3;
            z-index: 1;
        }

        #timer-display {
            font-size: 8rem;
            font-weight: 800;
            color: #050505;
            z-index: 2;
            position: relative;
            letter-spacing: -2px;
        }

        /* --- Modifier / Safety Cues (Bottom Right) --- */
        #safety-cues {
            position: absolute;
            bottom: 40px;
            right: 40px;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 30px;
            border-left: 6px solid #f3dfb3;
            border-radius: 4px;
            font-size: 1.4rem;
            color: #fff;
            max-width: 40%;
            display: none; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
        }

        /* --- Overlays --- */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(51, 51, 51, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 40; text-align: center;
        }
        
        #pause-overlay {
            background: rgba(51, 51, 51, 0.85);
            z-index: 25;
            display: none;
            backdrop-filter: blur(5px);
        }
        #pause-overlay h1 {
            color: #e09f69;
            font-size: 6rem;
            letter-spacing: 5px;
            margin: 0;
            text-transform: uppercase;
        }

        h2.loading { color: #f3dfb3; font-size: 3rem; font-weight: 600;}
        
        button.action-btn {
            font-family: 'Montserrat', sans-serif; font-size: 1.5rem; font-weight: 700;
            padding: 15px 40px; background: #e09f69; color: #111;
            border: none; cursor: pointer; text-transform: uppercase;
            border-radius: 4px; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        button.action-btn:hover { background: #f3dfb3; transform: translateY(-2px); }

        select {
            font-family: 'Montserrat', sans-serif; font-size: 1.2rem; font-weight: 600;
            padding: 12px; margin-bottom: 30px; background: #fff;
            color: #333; border: 2px solid #e09f69; border-radius: 4px; width: 80%; max-width: 400px;
        }

        /* Finisher text */
        .overlay h1 { color: #e09f69; font-size: 4.5rem; margin: 0; text-transform: uppercase; }
        .overlay h2.sub { color: #ccc; font-size: 2rem; font-weight: 400; margin-top: 10px; margin-bottom: 40px; }
        .finisher-btn-group { display: flex; gap: 20px; margin-bottom: 30px; }
        .small-btn { font-size: 1rem; padding: 10px 20px; background: transparent; color: #aaa; border: 1px solid #777; border-radius: 4px; cursor: pointer; }
        .small-btn:hover { background: #fff; color: #111;}

    </style>
</head>
<body>

    <div class="geo-shape hex-bg hex-1"></div>
    <div class="geo-shape hex-bg hex-2"></div>
    <div class="geo-shape line line-1"></div>
    <div class="geo-shape line line-2"></div>
    <div class="geo-shape line line-3"></div>
    <div class="geo-shape dot dot-1"></div>
    <div class="geo-shape dot dot-2"></div>

    <div id="app-container">
        
        <div id="top-controls" style="display: none;">
            <button id="prev-btn" class="ctrl-btn" title="Previous / Restart (Left Arrow)">⏮️</button>
            <button id="next-btn" class="ctrl-btn" title="Skip Forward (Right Arrow)">⏭️</button>
            <button id="pause-btn" class="ctrl-btn" title="Pause (Spacebar)">⏸️</button>
            <button id="modifier-btn" class="ctrl-btn" title="Toggle Cues (S)">💪</button>
            <button id="mute-btn" class="ctrl-btn" title="Mute (M)">🔊</button>
            <button id="fullscreen-btn" class="ctrl-btn" title="Toggle Fullscreen (F)">🔲</button>
        </div>

        <div id="left-column" style="display: none;">
            <h1 id="circuit-name" class="embossed-text">Circuit</h1>
            <h2 id="round-number" class="embossed-text embossed-sub">ROUND 1</h2>
            <h2 id="total-time" class="embossed-text embossed-sub" style="margin-top: 20px; color: #b3c2c2;">TOT 00:00</h2>
        </div>

        <div id="main-content" style="display: none;">
            <h1 id="exercise-name">Get Ready...</h1>
        </div>

        <div id="timer-box" style="display: none;">
            <div id="timer-display">00</div>
        </div>

        <div id="safety-cues"></div>

        <div id="start-overlay" class="overlay">
            <h2 id="loading-text" class="loading">Loading Workout Data...</h2>
            <select id="workout-selector" style="display: none;"></select>
            <button id="start-btn" class="action-btn" style="display: none;">START WORKOUT</button>
        </div>

        <div id="pause-overlay" class="overlay">
            <h1>PAUSED</h1>
        </div>

        <div id="finisher-overlay" class="overlay" style="display: none;">
            <h1>Workout Complete</h1>
            <h2 class="sub">Select an optional finisher:</h2>
            
            <div class="finisher-btn-group">
                <button class="action-btn" onclick="startFinisher('finisher_core')">3-Min Core</button>
                <button class="action-btn" onclick="startFinisher('finisher_cardio')">3-Min Cardio</button>
                <button class="action-btn" onclick="startFinisher('finisher_upper')">3-Min Upper</button>
            </div>
            
            <button onclick="location.reload()" class="small-btn">NO THANKS (RESET)</button>
        </div>

    </div>

    <script>
        const EXERCISES_URL = 'https://raw.githubusercontent.com/scottscalici/PE/main/workout/exercises.json';
        const WORKOUT_URL = 'https://raw.githubusercontent.com/scottscalici/PE/main/workout/workout_routine.json';

        // --- CONFIGURATION ---
        const TARGET_WORKOUT_ID = ""; 
        // ---------------------

        let exerciseDB = {};
        let allWorkouts = [];
        let playlist = []; 
        let currentIndex = 0;
        
        let totalTimeRemaining = 0;
        let exerciseTimeRemaining = 0;
        let timerInterval;

        // Audio & State Setup
        let isMuted = false;
        let isPaused = false;
        let showModifier = false; 
        let audioCtx;

        function playBeep(type) {
            if (isMuted || isPaused) return;
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'short') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(440, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'long') {
                oscillator.type = 'square';
                oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                oscillator.stop(audioCtx.currentTime + 0.8);
            }
        }

        // --- Helper Functions ---
        function recalculateRemainingTotal(fromIndex) {
            let total = 0;
            for (let i = fromIndex; i < playlist.length; i++) {
                total += playlist[i].duration;
            }
            return total;
        }

        function forceUnpause() {
            isPaused = false;
            document.getElementById('pause-btn').innerText = '⏸️';
            document.getElementById('pause-btn').classList.remove('active-state');
            document.getElementById('pause-overlay').style.display = 'none';
        }

        // --- Top Controls Event Listeners ---
        document.getElementById('prev-btn').addEventListener('click', function() {
            if (playlist.length === 0) return; 
            clearInterval(timerInterval); 
            forceUnpause();
            if (currentIndex > 0) currentIndex--; 
            totalTimeRemaining = recalculateRemainingTotal(currentIndex);
            runBlock(currentIndex);
        });

        document.getElementById('next-btn').addEventListener('click', function() {
            if (playlist.length === 0 || currentIndex >= playlist.length) return;
            clearInterval(timerInterval);
            forceUnpause();
            currentIndex++;
            if (currentIndex >= playlist.length) {
                finishWorkout(); 
            } else {
                totalTimeRemaining = recalculateRemainingTotal(currentIndex);
                runBlock(currentIndex);
            }
        });

        document.getElementById('mute-btn').addEventListener('click', function() {
            isMuted = !isMuted;
            if (isMuted) {
                this.innerText = '🔇';
                this.classList.add('active-state');
            } else {
                this.innerText = '🔊';
                this.classList.remove('active-state');
            }
        });

        document.getElementById('pause-btn').addEventListener('click', function() {
            isPaused = !isPaused;
            if (isPaused) {
                this.innerText = '▶️';
                this.classList.add('active-state');
                document.getElementById('pause-overlay').style.display = 'flex';
            } else {
                forceUnpause();
            }
        });

        document.getElementById('modifier-btn').addEventListener('click', function() {
            showModifier = !showModifier;
            if (showModifier) {
                this.classList.add('active-state');
            } else {
                this.classList.remove('active-state');
            }
            if (playlist.length > 0) updateUI(playlist[currentIndex]);
        });

        // --- SMART FULLSCREEN LOGIC ---
        function updateFullscreenIcon(isActive) {
            const btn = document.getElementById('fullscreen-btn');
            if (isActive) {
                btn.innerText = '✖️'; 
                btn.classList.add('active-state');
            } else {
                btn.innerText = '🔲'; 
                btn.classList.remove('active-state');
            }
        }

        document.getElementById('fullscreen-btn').addEventListener('click', function() {
            const docElm = document.documentElement;
            const container = document.getElementById('app-container');
            const isNativeFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
            const isPseudoFullscreen = container.classList.contains('pseudo-fullscreen');

            if (!isNativeFullscreen && !isPseudoFullscreen) {
                if (docElm.requestFullscreen) {
                    docElm.requestFullscreen().catch(() => { container.classList.add('pseudo-fullscreen'); updateFullscreenIcon(true); });
                } else if (docElm.webkitRequestFullscreen) {
                    try { docElm.webkitRequestFullscreen(); } catch(e) { container.classList.add('pseudo-fullscreen'); updateFullscreenIcon(true); }
                } else {
                    container.classList.add('pseudo-fullscreen'); updateFullscreenIcon(true);
                }
            } else {
                if (isNativeFullscreen) {
                    if (document.exitFullscreen) document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                }
                if (isPseudoFullscreen) { container.classList.remove('pseudo-fullscreen'); updateFullscreenIcon(false); }
            }
        });

        const handleFullscreenChange = () => {
            const isNativeFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
            const isPseudoFullscreen = document.getElementById('app-container').classList.contains('pseudo-fullscreen');
            if (!isNativeFullscreen && !isPseudoFullscreen) updateFullscreenIcon(false);
            else if (isNativeFullscreen) updateFullscreenIcon(true);
        };
        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);

        // --- Keyboard Shortcuts ---
        document.addEventListener('keydown', function(event) {
            if (playlist.length === 0) return;
            switch(event.code) {
                case 'Space': event.preventDefault(); document.getElementById('pause-btn').click(); break;
                case 'ArrowRight': event.preventDefault(); document.getElementById('next-btn').click(); break;
                case 'ArrowLeft': event.preventDefault(); document.getElementById('prev-btn').click(); break;
                case 'KeyM': document.getElementById('mute-btn').click(); break;
                case 'KeyF': document.getElementById('fullscreen-btn').click(); break;
                case 'KeyS': document.getElementById('modifier-btn').click(); break;
            }
        });

        // --- Data Fetching ---
        async function init() {
            try {
                const noCache = '?t=' + new Date().getTime();
                const [exResponse, woResponse] = await Promise.all([
                    fetch(EXERCISES_URL + noCache),
                    fetch(WORKOUT_URL + noCache)
                ]);

                const exData = await exResponse.json();
                const woData = await woResponse.json();

                exData.exercises.forEach(ex => { exerciseDB[ex.id] = ex; });
                allWorkouts = woData.workouts;

                const selector = document.getElementById('workout-selector');

                allWorkouts.forEach((wo, index) => {
                    let option = document.createElement('option');
                    option.value = index;
                    option.text = wo.workoutName;
                    selector.appendChild(option);
                });
                
                if (TARGET_WORKOUT_ID !== "") {
                    const targetIndex = allWorkouts.findIndex(w => w.id === TARGET_WORKOUT_ID);
                    if (targetIndex !== -1) {
                        selector.value = targetIndex; 
                        document.getElementById('loading-text').innerText = allWorkouts[targetIndex].workoutName;
                    } else {
                        document.getElementById('loading-text').innerText = "Workout ID not found!";
                    }
                } else {
                    document.getElementById('loading-text').style.display = 'none';
                    selector.style.display = 'block';
                }

                document.getElementById('start-btn').style.display = 'block';
                document.getElementById('start-btn').addEventListener('click', prepareWorkout);

            } catch (error) {
                console.error("Failed to load JSON files:", error);
                document.getElementById('loading-text').innerText = "Error Loading GitHub Data.";
            }
        }

        // --- Workout Logic ---
        function prepareWorkout() {
            const selectedIndex = document.getElementById('workout-selector').value;
            const selectedWorkout = allWorkouts[selectedIndex];
            
            playlist = []; 
            totalTimeRemaining = 0;

            selectedWorkout.circuits.forEach(circuit => {
                const circuitRounds = circuit.rounds || 1; 
                
                for (let r = 0; r < circuitRounds; r++) {
                    circuit.sequence.forEach(block => {
                        const details = exerciseDB[block.exerciseId] || { name: 'Unknown', safetyCues: '' };
                        playlist.push({
                            ...block,
                            name: details.name,
                            safetyCues: details.safetyCues,
                            roundNum: r + 1,
                            circuitName: circuit.circuitId || 'Circuit'
                        });
                        totalTimeRemaining += block.duration; 
                    });
                }
            });

            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            document.getElementById('start-overlay').style.display = 'none';
            document.getElementById('finisher-overlay').style.display = 'none';
            
            // Show all UI elements
            document.getElementById('top-controls').style.display = 'flex';
            document.getElementById('left-column').style.display = 'flex';
            document.getElementById('main-content').style.display = 'flex';
            document.getElementById('timer-box').style.display = 'flex';
            
            runBlock(0);
        }

        function runBlock(index) {
            if (index >= playlist.length) {
                finishWorkout();
                return;
            }

            currentIndex = index;
            const currentBlock = playlist[index];
            exerciseTimeRemaining = currentBlock.duration;

            updateUI(currentBlock);

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (isPaused) return;

                exerciseTimeRemaining--;
                totalTimeRemaining--;
                
                if (exerciseTimeRemaining === 3 || exerciseTimeRemaining === 2 || exerciseTimeRemaining === 1) {
                    playBeep('short');
                } else if (exerciseTimeRemaining === 0) {
                    playBeep('long');
                }
                
                updateTimerDisplay(currentBlock.type);

                if (exerciseTimeRemaining <= 0) {
                    clearInterval(timerInterval);
                    runBlock(index + 1);
                }
            }, 1000);
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function updateUI(block) {
            // Update the Left Panel
            document.getElementById('circuit-name').innerText = block.circuitName;
            document.getElementById('round-number').innerText = `ROUND ${block.roundNum}`;

            // Update the Main Exercise Text
            const exNameEl = document.getElementById('exercise-name');
            if (block.type === 'rest') {
                exNameEl.innerText = `Rest (${block.duration}s)`;
                exNameEl.classList.add('rest-text');
            } else {
                exNameEl.innerText = block.name;
                exNameEl.classList.remove('rest-text');
            }

            // Safety Cues
            const cuesEl = document.getElementById('safety-cues');
            if (showModifier && block.safetyCues && block.safetyCues.trim() !== "") {
                cuesEl.innerHTML = `💡 ${block.safetyCues}`;
                cuesEl.style.display = 'block';
            } else {
                cuesEl.style.display = 'none';
            }

            updateTimerDisplay(block.type);
        }

        function updateTimerDisplay(type) {
            document.getElementById('total-time').innerText = `TOT ${formatTime(Math.max(0, totalTimeRemaining))}`;
            document.getElementById('timer-display').innerText = exerciseTimeRemaining;

            const timerBox = document.getElementById('timer-box');
            
            // Turn the white box pinkish/red if resting or low on time
            if (type === 'rest' || exerciseTimeRemaining <= 5) {
                timerBox.classList.add('warning');
            } else {
                timerBox.classList.remove('warning');
            }
        }

        function finishWorkout() {
            document.getElementById('top-controls').style.display = 'none';
            document.getElementById('left-column').style.display = 'none';
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('safety-cues').style.display = 'none';
            document.getElementById('timer-box').style.display = 'none';
            document.getElementById('finisher-overlay').style.display = 'flex';
        }

        function startFinisher(finisherId) {
            const targetIndex = allWorkouts.findIndex(w => w.id === finisherId);
            
            if (targetIndex !== -1) {
                document.getElementById('workout-selector').value = targetIndex;
                prepareWorkout(); 
            } else {
                alert("Finisher workout '" + finisherId + "' not found in your JSON.");
            }
        }

        init();
    </script>
</body>
</html>
