<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chalkboard Workout Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Gochi+Hand&family=Montserrat:wght@600&display=swap" rel="stylesheet">
    <style>
        /* Chalkboard Aesthetic Styling */
        body {
            background-color: #2b2e31;
            color: #e0e0e0;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Subtle chalk dust/noise texture */
            background-image: 
                radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 100%),
                linear-gradient(rgba(255, 255, 255, 0.01) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.01) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
            overflow: hidden; 
        }

        #app-container {
            width: 95%;
            max-width: 1200px;
            height: 90vh;
            background: #2a2c2e;
            border: 12px solid #1a1a1a;
            border-radius: 8px;
            position: relative;
            box-shadow: inset 0 0 80px rgba(0,0,0,0.9), 0 15px 35px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* Pseudo-Fullscreen Fallback Class */
        .pseudo-fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
            border-radius: 0 !important;
            border: none !important;
            z-index: 9999 !important;
        }

        /* Top Control Bar */
        #top-controls {
            position: absolute;
            top: 15px;
            right: 20px;
            z-index: 30; 
            display: flex;
            gap: 10px;
        }

        .control-btn {
            background: transparent;
            color: #888;
            border: 2px solid #555;
            font-size: 1.2rem;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .control-btn:hover { color: #fff; border-color: #fff; }
        .active-state { color: #ffcc00 !important; border-color: #ffcc00 !important; }
        .muted-state { color: #ff4500 !important; border-color: #ff4500 !important; }

        /* Main Grid Layout */
        #chalkboard-layout {
            display: flex;
            width: 100%;
            height: 100%;
            padding: 40px;
            box-sizing: border-box;
        }

        #left-panel {
            width: 45%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        #right-panel {
            width: 55%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding-left: 40px;
            border-left: 2px dashed rgba(255,255,255,0.1);
        }

        /* Top Left Counter */
        #round-counter {
            font-size: 3rem;
            font-weight: 600;
            color: #fff;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
            letter-spacing: 2px;
        }

        /* Header (EMOM Style) */
        #current-exercise {
            font-family: 'Black Ops One', cursive;
            font-size: 4.5rem;
            color: #fff;
            text-shadow: 2px 2px 0px #000, 4px 4px 10px rgba(0,0,0,0.6);
            margin: 0;
            margin-top: -10px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* Chalk Blue List */
        #up-next-container {
            flex-grow: 1;
        }

        #up-next-container h3 {
            font-family: 'Gochi Hand', cursive;
            color: #aaa;
            font-size: 2rem;
            margin-bottom: 15px;
            letter-spacing: 2px;
            text-decoration: underline;
        }

        #next-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-family: 'Gochi Hand', cursive;
            font-size: 3.5rem;
            color: #5d9cec; /* Chalk Blue */
            line-height: 1.4;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #next-list li { margin-bottom: 15px; }
        
        /* Highlight the immediate next exercise slightly brighter */
        #next-list li:first-child { color: #8ec1ff; }

        /* Modifier / Safety Cues */
        #safety-cues {
            font-family: 'Gochi Hand', cursive;
            font-size: 2.5rem;
            color: #ffcc00;
            margin-top: 20px;
            text-shadow: 1px 1px 3px #000;
            display: none; 
        }

        /* Bottom Left: Timer Box */
        #timer-widget {
            background: #111;
            border: 3px solid #000;
            border-radius: 12px;
            padding: 20px 30px;
            box-shadow: 0 15px 25px rgba(0,0,0,0.9), inset 0 0 20px rgba(0,0,0,0.8);
            text-align: center;
            width: fit-content;
        }

        .timer-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem; color: #777; text-transform: uppercase;
            letter-spacing: 2px; margin-bottom: 5px;
        }

        #total-time-display {
            font-family: 'Black Ops One', cursive;
            font-size: 7rem; 
            color: transparent; /* Makes the inside clear */
            -webkit-text-stroke: 2px #fff; /* White outline */
            margin-bottom: 10px;
            letter-spacing: 5px;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
            line-height: 1;
        }

        /* Shrinking Bar Area */
        #progress-header {
            display: flex; justify-content: space-between; font-size: 1.2rem;
            color: #aaa; margin-bottom: 5px; font-family: 'Montserrat', sans-serif;
            font-weight: bold;
        }

        #progress-track {
            width: 100%; height: 15px; background: #222;
            border: 2px solid #000; border-radius: 8px; overflow: hidden;
            box-shadow: inset 0 0 5px #000;
        }

        #progress-fill {
            height: 100%; width: 100%; background: #e0e0e0; 
            transition: width 1s linear, background-color 0.5s ease, box-shadow 0.5s ease;
        }

        /* Dynamic Color Classes */
        .rest-text { color: #ff4500 !important; -webkit-text-stroke: 0px !important; }
        .glow-yellow { background: #ffcc00 !important; box-shadow: 0 0 15px #ffcc00; }
        .glow-orange { background: #ff4500 !important; box-shadow: 0 0 15px #ff4500; }

        /* Overlays */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(42, 44, 46, 0.95);
        }

        #start-overlay { z-index: 40; }
        
        #pause-overlay {
            background: rgba(0,0,0,0.85); z-index: 20; display: none; text-align: center;
        }
        #pause-overlay h1 {
            font-family: 'Black Ops One', cursive;
            color: #ffcc00; font-size: 8rem; letter-spacing: 5px; margin: 0;
            text-shadow: 0 0 30px rgba(255, 204, 0, 0.5);
            -webkit-text-stroke: 2px #fff;
        }

        #finisher-overlay {
            display: none; text-align: center; z-index: 25;
        }
        #finisher-overlay h1 { font-family: 'Black Ops One', cursive; color: #fff; font-size: 5rem; text-shadow: 3px 3px 5px #000; margin: 0; }
        #finisher-overlay h2 { font-family: 'Gochi Hand', cursive; color: #5d9cec; font-size: 3.5rem; margin-top: 10px; margin-bottom: 40px; }
        .finisher-btn-group { display: flex; gap: 20px; margin-bottom: 30px; }

        select {
            font-family: 'Montserrat', sans-serif; font-size: 1.5rem; padding: 10px;
            margin-bottom: 20px; background: #222; color: #fff; border: 2px solid #555;
            border-radius: 5px; width: 80%; max-width: 400px;
        }

        button.big-btn {
            font-family: 'Black Ops One', cursive; font-size: 2.5rem; padding: 20px 40px;
            background: #111; color: #fff; border: 3px solid #444; cursor: pointer;
            text-transform: uppercase; border-radius: 8px; transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        button.big-btn:hover { background: #333; border-color: #777; color: #ffcc00; }
        .small-btn { font-family: 'Montserrat', sans-serif; font-size: 1.2rem; padding: 10px 20px; background: transparent; color: #aaa; border: 2px solid #444; cursor: pointer; border-radius: 5px; }
        .small-btn:hover { color: #fff; border-color: #fff; }
    </style>
</head>
<body>

    <div id="app-container">
        
        <div id="top-controls" style="display: none;">
            <button id="prev-btn" class="control-btn" title="Previous / Restart (Left Arrow)">⏮️</button>
            <button id="next-btn" class="control-btn" title="Skip Forward (Right Arrow)">⏭️</button>
            <button id="pause-btn" class="control-btn" title="Pause (Spacebar)">⏸️</button>
            <button id="modifier-btn" class="control-btn" title="Toggle Modifier/Cues (S)">💪</button>
            <button id="mute-btn" class="control-btn" title="Mute (M)">🔊</button>
            <button id="fullscreen-btn" class="control-btn" title="Toggle Fullscreen (F)">🔲</button>
        </div>

        <div id="start-overlay" class="overlay">
            <h2 id="loading-text" style="color: #fff; font-family: 'Gochi Hand', cursive; font-size: 3rem;">Loading Chalkboard...</h2>
            <select id="workout-selector" style="display: none;"></select>
            <button id="start-btn" class="big-btn" style="display: none;">START</button>
        </div>

        <div id="pause-overlay" class="overlay">
            <h1>PAUSED</h1>
        </div>

        <div id="chalkboard-layout" style="display: none;">
            
            <div id="left-panel">
                <div>
                    <div id="round-counter">1/1</div>
                    <h1 id="current-exercise">EMOM</h1>
                    <div id="safety-cues"></div>
                </div>

                <div id="timer-widget">
                    <div class="timer-label">Total Time</div>
                    <div id="total-time-display">:00</div>
                    
                    <div id="progress-header">
                        <span>Current</span>
                        <span id="exercise-time-display">00s</span>
                    </div>
                    <div id="progress-track">
                        <div id="progress-fill"></div>
                    </div>
                </div>
            </div>

            <div id="right-panel">
                <div id="up-next-container">
                    <h3>Up Next</h3>
                    <ul id="next-list"></ul>
                </div>
            </div>

        </div>

        <div id="finisher-overlay" class="overlay">
            <h1>WORKOUT COMPLETE</h1>
            <h2>Want some more?</h2>
            
            <div class="finisher-btn-group">
                <button class="big-btn" onclick="startFinisher('finisher_core')" style="font-size: 1.5rem; padding: 15px 30px;">3-MIN CORE</button>
                <button class="big-btn" onclick="startFinisher('finisher_cardio')" style="font-size: 1.5rem; padding: 15px 30px;">3-MIN CARDIO</button>
                <button class="big-btn" onclick="startFinisher('finisher_upper')" style="font-size: 1.5rem; padding: 15px 30px;">3-MIN UPPER</button>
            </div>
            
            <button onclick="location.reload()" class="small-btn">NO THANKS (RESET)</button>
        </div>

    </div>

    <script>
        const EXERCISES_URL = 'https://raw.githubusercontent.com/scottscalici/PE/main/workout/exercises.json';
        const WORKOUT_URL = 'https://raw.githubusercontent.com/scottscalici/PE/main/workout/workout_routine.json';

        // --- CONFIGURATION ---
        const TARGET_WORKOUT_ID = ""; 
        // ---------------------

        let exerciseDB = {};
        let allWorkouts = [];
        let playlist = []; 
        let currentIndex = 0;
        
        let totalTimeRemaining = 0;
        let exerciseTimeRemaining = 0;
        let timerInterval;

        // Audio & State Setup
        let isMuted = false;
        let isPaused = false;
        let showModifier = false; 
        let audioCtx;

        function playBeep(type) {
            if (isMuted || isPaused) return; 
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'short') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(440, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'long') {
                oscillator.type = 'square';
                oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                oscillator.stop(audioCtx.currentTime + 0.8);
            }
        }

        // --- Helper: Recalculate Total Time ---
        function recalculateRemainingTotal(fromIndex) {
            let total = 0;
            for (let i = fromIndex; i < playlist.length; i++) {
                total += playlist[i].duration;
            }
            return total;
        }

        // --- Helper: Force Unpause ---
        function forceUnpause() {
            isPaused = false;
            document.getElementById('pause-btn').innerText = '⏸️';
            document.getElementById('pause-btn').classList.remove('active-state');
            document.getElementById('pause-overlay').style.display = 'none';
        }

        // --- Button Event Listeners ---
        document.getElementById('prev-btn').addEventListener('click', function() {
            if (playlist.length === 0) return; 
            clearInterval(timerInterval); 
            forceUnpause();
            if (currentIndex > 0) currentIndex--; 
            totalTimeRemaining = recalculateRemainingTotal(currentIndex);
            runBlock(currentIndex);
        });

        document.getElementById('next-btn').addEventListener('click', function() {
            if (playlist.length === 0 || currentIndex >= playlist.length) return;
            clearInterval(timerInterval);
            forceUnpause();
            currentIndex++;
            if (currentIndex >= playlist.length) {
                finishWorkout(); 
            } else {
                totalTimeRemaining = recalculateRemainingTotal(currentIndex);
                runBlock(currentIndex);
            }
        });

        document.getElementById('mute-btn').addEventListener('click', function() {
            isMuted = !isMuted;
            if (isMuted) {
                this.innerText = '🔇';
                this.classList.add('muted-state');
            } else {
                this.innerText = '🔊';
                this.classList.remove('muted-state');
            }
        });

        document.getElementById('pause-btn').addEventListener('click', function() {
            isPaused = !isPaused;
            if (isPaused) {
                this.innerText = '▶️';
                this.classList.add('active-state');
                document.getElementById('pause-overlay').style.display = 'flex';
            } else {
                forceUnpause();
            }
        });

        document.getElementById('modifier-btn').addEventListener('click', function() {
            showModifier = !showModifier;
            if (showModifier) {
                this.classList.add('active-state');
            } else {
                this.classList.remove('active-state');
            }
            if (playlist.length > 0) {
                updateUI(playlist[currentIndex]);
            }
        });

        // --- SMART FULLSCREEN LOGIC ---
        function updateFullscreenIcon(isActive) {
            const btn = document.getElementById('fullscreen-btn');
            if (isActive) {
                btn.innerText = '✖️'; 
                btn.classList.add('active-state');
            } else {
                btn.innerText = '🔲'; 
                btn.classList.remove('active-state');
            }
        }

        document.getElementById('fullscreen-btn').addEventListener('click', function() {
            const docElm = document.documentElement;
            const container = document.getElementById('app-container');
            
            const isNativeFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
            const isPseudoFullscreen = container.classList.contains('pseudo-fullscreen');

            if (!isNativeFullscreen && !isPseudoFullscreen) {
                if (docElm.requestFullscreen) {
                    docElm.requestFullscreen().catch(err => {
                        container.classList.add('pseudo-fullscreen');
                        updateFullscreenIcon(true);
                    });
                } else if (docElm.webkitRequestFullscreen) {
                    try { docElm.webkitRequestFullscreen(); } catch(e) {
                        container.classList.add('pseudo-fullscreen');
                        updateFullscreenIcon(true);
                    }
                } else {
                    container.classList.add('pseudo-fullscreen');
                    updateFullscreenIcon(true);
                }
            } else {
                if (isNativeFullscreen) {
                    if (document.exitFullscreen) document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                }
                if (isPseudoFullscreen) {
                    container.classList.remove('pseudo-fullscreen');
                    updateFullscreenIcon(false);
                }
            }
        });

        const handleFullscreenChange = () => {
            const isNativeFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
            const isPseudoFullscreen = document.getElementById('app-container').classList.contains('pseudo-fullscreen');
            
            if (!isNativeFullscreen && !isPseudoFullscreen) {
                updateFullscreenIcon(false);
            } else if (isNativeFullscreen) {
                updateFullscreenIcon(true);
            }
        };
        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);

        // --- Keyboard Shortcuts ---
        document.addEventListener('keydown', function(event) {
            if (playlist.length === 0) return;
            switch(event.code) {
                case 'Space':
                    event.preventDefault(); 
                    document.getElementById('pause-btn').click();
                    break;
                case 'ArrowRight':
                    event.preventDefault();
                    document.getElementById('next-btn').click();
                    break;
                case 'ArrowLeft':
                    event.preventDefault();
                    document.getElementById('prev-btn').click();
                    break;
                case 'KeyM':
                    document.getElementById('mute-btn').click();
                    break;
                case 'KeyF':
                    document.getElementById('fullscreen-btn').click();
                    break;
                case 'KeyS':
                    document.getElementById('modifier-btn').click();
                    break;
            }
        });

        async function init() {
            try {
                const noCache = '?t=' + new Date().getTime();

                const [exResponse, woResponse] = await Promise.all([
                    fetch(EXERCISES_URL + noCache),
                    fetch(WORKOUT_URL + noCache)
                ]);

                const exData = await exResponse.json();
                const woData = await woResponse.json();

                exData.exercises.forEach(ex => { exerciseDB[ex.id] = ex; });
                allWorkouts = woData.workouts;

                const selector = document.getElementById('workout-selector');

                allWorkouts.forEach((wo, index) => {
                    let option = document.createElement('option');
                    option.value = index;
                    option.text = wo.workoutName;
                    selector.appendChild(option);
                });
                
                if (TARGET_WORKOUT_ID !== "") {
                    const targetIndex = allWorkouts.findIndex(w => w.id === TARGET_WORKOUT_ID);
                    if (targetIndex !== -1) {
                        selector.value = targetIndex; 
                        document.getElementById('current-exercise').innerText = allWorkouts[targetIndex].workoutName;
                    } else {
                        document.getElementById('current-exercise').innerText = "Workout ID not found!";
                    }
                } else {
                    selector.style.display = 'block';
                }

                document.getElementById('loading-text').style.display = 'none';
                document.getElementById('start-btn').style.display = 'block';
                document.getElementById('top-controls').style.display = 'flex';

                document.getElementById('start-btn').addEventListener('click', prepareWorkout);

            } catch (error) {
                console.error("Failed to load JSON files:", error);
                document.getElementById('loading-text').innerText = "Error Loading GitHub Data.";
            }
        }

        function prepareWorkout() {
            const selectedIndex = document.getElementById('workout-selector').value;
            const selectedWorkout = allWorkouts[selectedIndex];
            
            playlist = []; 
            totalTimeRemaining = 0;

            const rounds = selectedWorkout.rounds || 1;
            for (let r = 0; r < rounds; r++) {
                selectedWorkout.circuits.forEach(circuit => {
                    circuit.sequence.forEach(block => {
                        const details = exerciseDB[block.exerciseId] || { name: 'Unknown', safetyCues: '' };
                        playlist.push({
                            ...block,
                            name: details.name,
                            safetyCues: details.safetyCues 
                        });
                        totalTimeRemaining += block.duration; 
                    });
                });
            }

            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            document.getElementById('start-overlay').style.display = 'none';
            document.getElementById('finisher-overlay').style.display = 'none';
            document.getElementById('chalkboard-layout').style.display = 'flex';
            
            runBlock(0);
        }

        function runBlock(index) {
            if (index >= playlist.length) {
                finishWorkout();
                return;
            }

            currentIndex = index;
            const currentBlock = playlist[index];
            exerciseTimeRemaining = currentBlock.duration;

            updateUI(currentBlock);

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (isPaused) return; 

                exerciseTimeRemaining--;
                totalTimeRemaining--;
                
                if (exerciseTimeRemaining === 3 || exerciseTimeRemaining === 2 || exerciseTimeRemaining === 1) {
                    playBeep('short');
                } else if (exerciseTimeRemaining === 0) {
                    playBeep('long');
                }
                
                updateTimerDisplay(currentBlock.duration, currentBlock.type);

                if (exerciseTimeRemaining <= 0) {
                    clearInterval(timerInterval);
                    runBlock(index + 1);
                }
            }, 1000);
        }

        // Formats total time as "m:ss" and timer as ":ss" or "m:ss"
        function formatTotalTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${s.toString().padStart(2, '0')}`;
        }
        
        function formatBigTimer(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            if (m > 0) {
                return `${m}:${s.toString().padStart(2, '0')}`;
            } else {
                return `:${s.toString().padStart(2, '0')}`;
            }
        }

        function updateUI(block) {
            const titleEl = document.getElementById('current-exercise');
            titleEl.innerText = block.name;
            
            // Update the counter to show current exercise / total exercises
            document.getElementById('round-counter').innerText = `${currentIndex + 1}/${playlist.length}`;

            if (block.type === 'rest') {
                titleEl.classList.add('rest-text');
                document.getElementById('total-time-display').style.webkitTextStroke = "2px #ff4500";
            } else {
                titleEl.classList.remove('rest-text');
                document.getElementById('total-time-display').style.webkitTextStroke = "2px #fff";
            }

            // Populate the "Up Next" list with blue chalk styling
            const nextList = document.getElementById('next-list');
            nextList.innerHTML = '';
            for (let i = 1; i <= 4; i++) {
                if (currentIndex + i < playlist.length) {
                    let nextBlock = playlist[currentIndex + i];
                    let li = document.createElement('li');
                    li.innerText = `${nextBlock.name} x ${nextBlock.duration}s`;
                    nextList.appendChild(li);
                }
            }

            const cuesEl = document.getElementById('safety-cues');
            if (showModifier && block.safetyCues && block.safetyCues.trim() !== "") {
                cuesEl.innerText = `💡 ${block.safetyCues}`;
                cuesEl.style.display = 'block';
            } else {
                cuesEl.style.display = 'none';
            }

            updateTimerDisplay(block.duration, block.type);
        }

        function updateTimerDisplay(totalDuration, type) {
            // Updated to use the format from the image
            document.getElementById('total-time-display').innerText = formatBigTimer(Math.max(0, totalTimeRemaining));
            document.getElementById('exercise-time-display').innerText = exerciseTimeRemaining + 's';

            const percentage = (exerciseTimeRemaining / totalDuration) * 100;
            const fillEl = document.getElementById('progress-fill');
            fillEl.style.width = percentage + '%';

            fillEl.classList.remove('glow-orange', 'glow-yellow');

            if (type === 'rest' || exerciseTimeRemaining <= 5) {
                fillEl.classList.add('glow-orange');
            } else if (exerciseTimeRemaining <= 10) {
                fillEl.classList.add('glow-yellow');
            }
        }

        function finishWorkout() {
            document.getElementById('chalkboard-layout').style.display = 'none';
            document.getElementById('finisher-overlay').style.display = 'flex';
        }

        function startFinisher(finisherId) {
            const targetIndex = allWorkouts.findIndex(w => w.id === finisherId);
            
            if (targetIndex !== -1) {
                document.getElementById('chalkboard-layout').style.display = 'flex';
                document.getElementById('workout-selector').value = targetIndex;
                prepareWorkout(); 
            } else {
                alert("Hold up! Finisher workout '" + finisherId + "' not found in your JSON yet.");
            }
        }

        init();
    </script>
</body>
</html>
