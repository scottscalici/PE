<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline Workout Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* Modern Athletic Styling */
        body {
            background-color: #0d1b2a;
            color: #e0e0e0;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
        }

        #app-container {
            width: 95%;
            max-width: 1200px;
            height: 85vh;
            /* Recreating the two-tone blue curved overlay look */
            background: linear-gradient(135deg, #004e92, #000428);
            border-radius: 20px;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* Large curved background element to mimic the image's style */
        #app-container::before {
            content: '';
            position: absolute;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background: radial-gradient(circle at top right, rgba(255,255,255,0.05), transparent 50%);
            border-radius: 50%;
            pointer-events: none;
        }

        /* Pseudo-Fullscreen Fallback Class */
        .pseudo-fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
            border-radius: 0 !important;
            border: none !important;
            z-index: 9999 !important;
        }

        /* Top Control Bar */
        #top-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 30; 
            display: flex;
            gap: 10px;
        }

        .control-btn {
            background: rgba(0, 0, 0, 0.3);
            color: #ccc;
            border: 1px solid rgba(255,255,255,0.2);
            font-size: 1.2rem;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .control-btn:hover { background: rgba(0,0,0,0.6); color: #fff; border-color: rgba(255,255,255,0.5); }
        .active-state { color: #00d2ff !important; border-color: #00d2ff !important; }
        .muted-state { color: #ff4d4d !important; border-color: #ff4d4d !important; }

        /* Top Left Info (Round Display) */
        #top-info {
            position: absolute;
            top: 30px;
            left: 40px;
            z-index: 10;
        }

        #round-text {
            font-size: 2.5rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.8);
            margin: 0;
            letter-spacing: 2px;
        }

        /* TIMELINE LAYOUT */
        #timeline-wrapper {
            position: relative;
            width: 100%;
            height: 350px;
            margin: auto 0; /* Centers it vertically */
            display: flex;
            align-items: center;
            /* Fades out the edges so exercises smoothly appear/disappear */
            -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
            mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        }

        /* The main horizontal axis line */
        #timeline-axis {
            position: absolute;
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.3);
            top: 50%;
            transform: translateY(-50%);
            z-index: 1;
        }

        /* The sliding track */
        #timeline-track {
            display: flex;
            position: relative;
            z-index: 2;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            padding-left: 100px; /* Offset to start the first item a bit inward */
        }

        /* Individual Exercise Node */
        .timeline-node {
            width: 280px; /* Spacing between points */
            height: 250px;
            position: relative;
            flex-shrink: 0;
        }

        /* The circle on the line */
        .node-marker {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: transparent;
            border: 3px solid rgba(255, 255, 255, 0.4);
            transition: all 0.4s ease;
            box-sizing: border-box;
            z-index: 3;
        }

        /* The text label */
        .node-label {
            position: absolute;
            width: 200px;
            text-align: center;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.3rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            transition: all 0.4s ease;
        }

        /* The dashed connecting line */
        .node-stem {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            border-left: 2px dashed rgba(255, 255, 255, 0.3);
            transition: all 0.4s ease;
        }

        /* Positioning for Even/Odd nodes to alternate above/below the line */
        .top-node .node-label { bottom: 50%; margin-bottom: 45px; }
        .top-node .node-stem { bottom: 50%; height: 35px; }
        
        .bottom-node .node-label { top: 50%; margin-top: 45px; }
        .bottom-node .node-stem { top: 50%; height: 35px; }

        /* NODE STATES */
        /* Past Exercises */
        .timeline-node.completed .node-marker { border-color: #00d2ff; background: #00d2ff; }
        .timeline-node.completed .node-stem { border-color: #00d2ff; }
        .timeline-node.completed .node-label { color: rgba(255, 255, 255, 0.2); text-decoration: line-through; }

        /* Current Exercise */
        .timeline-node.active .node-marker { 
            border-color: #fff; background: #fff; width: 26px; height: 26px; 
            box-shadow: 0 0 15px rgba(255,255,255,0.8);
        }
        .timeline-node.active .node-stem { border-color: #fff; border-style: solid; }
        .timeline-node.active .node-label { color: #fff; font-size: 1.5rem; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .timeline-node.active.rest-node .node-marker { border-color: #ff4d4d; background: #ff4d4d; box-shadow: 0 0 15px #ff4d4d;}
        .timeline-node.active.rest-node .node-label { color: #ff4d4d; }

        /* Modifier / Safety Cues */
        #safety-cues {
            position: absolute;
            bottom: 40px;
            left: 40px;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px 25px;
            border-left: 5px solid #00d2ff;
            border-radius: 0 8px 8px 0;
            font-size: 1.2rem;
            color: #fff;
            max-width: 40%;
            display: none; 
            backdrop-filter: blur(10px);
        }

        /* TILTED TIMER WIDGET (Bottom Right) */
        #timer-widget {
            position: absolute;
            bottom: 40px;
            right: 50px;
            background: #050505;
            padding: 20px 40px;
            border-radius: 6px;
            transform: rotate(-4deg);
            box-shadow: 15px 15px 30px rgba(0,0,0,0.6), inset 0 0 10px rgba(255,255,255,0.05);
            text-align: center;
            z-index: 20;
            border: 1px solid #222;
            transition: border-color 0.3s;
        }

        #timer-widget.warning { border-color: #ffcc00; box-shadow: 0 0 20px rgba(255, 204, 0, 0.2); }
        #timer-widget.danger { border-color: #ff4d4d; box-shadow: 0 0 20px rgba(255, 77, 77, 0.2); }

        #total-time-display {
            font-size: 1rem; color: #888; text-transform: uppercase; letter-spacing: 2px;
            margin-bottom: 5px; text-align: left;
        }

        #exercise-time-display {
            font-size: 6rem;
            font-weight: 800;
            color: #fff;
            line-height: 1;
            letter-spacing: 2px;
        }

        /* Overlays */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0, 15, 30, 0.95);
            backdrop-filter: blur(10px);
        }

        #start-overlay { z-index: 50; }
        
        #pause-overlay { z-index: 40; display: none; text-align: center; }
        #pause-overlay h1 { color: #fff; font-size: 6rem; letter-spacing: 5px; margin: 0; font-weight: 800; }

        #finisher-overlay { display: none; text-align: center; z-index: 45; }
        #finisher-overlay h1 { color: #fff; font-size: 4rem; margin: 0; font-weight: 800; }
        #finisher-overlay h2 { color: #00d2ff; font-size: 2.5rem; margin-top: 10px; margin-bottom: 40px; font-weight: 400; }
        
        .finisher-btn-group { display: flex; gap: 20px; margin-bottom: 30px; }

        select {
            font-family: 'Montserrat', sans-serif; font-size: 1.5rem; padding: 15px;
            margin-bottom: 30px; background: rgba(0,0,0,0.5); color: #fff; border: 2px solid #00d2ff;
            border-radius: 8px; width: 80%; max-width: 400px; outline: none;
        }

        button.big-btn {
            font-family: 'Montserrat', sans-serif; font-size: 2rem; font-weight: 800; padding: 20px 50px;
            background: #fff; color: #004e92; border: none; cursor: pointer;
            text-transform: uppercase; border-radius: 50px; transition: 0.3s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        button.big-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(0,0,0,0.6); }
        .small-btn { font-family: 'Montserrat', sans-serif; font-size: 1rem; padding: 10px 20px; background: transparent; color: #888; border: 1px solid #444; cursor: pointer; border-radius: 5px; transition: 0.3s;}
        .small-btn:hover { color: #fff; border-color: #fff; }
    </style>
</head>
<body>

    <div id="app-container">
        
        <div id="top-controls" style="display: none;">
            <button id="prev-btn" class="control-btn" title="Previous / Restart (Left Arrow)">⏮️</button>
            <button id="next-btn" class="control-btn" title="Skip Forward (Right Arrow)">⏭️</button>
            <button id="pause-btn" class="control-btn" title="Pause (Spacebar)">⏸️</button>
            <button id="modifier-btn" class="control-btn" title="Toggle Cues (S)">💪</button>
            <button id="mute-btn" class="control-btn" title="Mute (M)">🔊</button>
            <button id="fullscreen-btn" class="control-btn" title="Toggle Fullscreen (F)">🔲</button>
        </div>

        <div id="start-overlay" class="overlay">
            <h2 id="loading-text" style="color: #fff; font-weight: 400; font-size: 2rem;">Loading Data...</h2>
            <select id="workout-selector" style="display: none;"></select>
            <button id="start-btn" class="big-btn" style="display: none;">START</button>
        </div>

        <div id="pause-overlay" class="overlay">
            <h1>PAUSED</h1>
        </div>

        <div id="top-info" style="display: none;">
            <h2 id="round-text">Round 1</h2>
        </div>

        <div id="timeline-wrapper" style="display: none;">
            <div id="timeline-axis"></div>
            <div id="timeline-track">
                </div>
        </div>

        <div id="safety-cues"></div>

        <div id="timer-widget" style="display: none;">
            <div id="total-time-display">TOTAL: 00:00</div>
            <div id="exercise-time-display">:00</div>
        </div>

        <div id="finisher-overlay" class="overlay">
            <h1>WORKOUT COMPLETE</h1>
            <h2>Keep the momentum going?</h2>
            
            <div class="finisher-btn-group">
                <button class="big-btn" onclick="startFinisher('finisher_core')" style="font-size: 1.2rem; padding: 15px 30px;">3-MIN CORE</button>
                <button class="big-btn" onclick="startFinisher('finisher_cardio')" style="font-size: 1.2rem; padding: 15px 30px;">3-MIN CARDIO</button>
                <button class="big-btn" onclick="startFinisher('finisher_upper')" style="font-size: 1.2rem; padding: 15px 30px;">3-MIN UPPER</button>
            </div>
            
            <button onclick="location.reload()" class="small-btn">NO THANKS (RESET)</button>
        </div>

    </div>

    <script>
        const EXERCISES_URL = 'https://raw.githubusercontent.com/scottscalici/PE/main/workout/exercises.json';
        const WORKOUT_URL = 'https://raw.githubusercontent.com/scottscalici/PE/main/workout/workout_routine.json';

        // --- CONFIGURATION ---
        const TARGET_WORKOUT_ID = ""; 
        // ---------------------

        let exerciseDB = {};
        let allWorkouts = [];
        let playlist = []; 
        let currentIndex = 0;
        
        let totalTimeRemaining = 0;
        let exerciseTimeRemaining = 0;
        let timerInterval;

        let isMuted = false;
        let isPaused = false;
        let showModifier = false; 
        let audioCtx;

        function playBeep(type) {
            if (isMuted || isPaused) return; 
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'short') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(440, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'long') {
                oscillator.type = 'square';
                oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                oscillator.stop(audioCtx.currentTime + 0.8);
            }
        }

        function recalculateRemainingTotal(fromIndex) {
            let total = 0;
            for (let i = fromIndex; i < playlist.length; i++) {
                total += playlist[i].duration;
            }
            return total;
        }

        function forceUnpause() {
            isPaused = false;
            document.getElementById('pause-btn').innerText = '⏸️';
            document.getElementById('pause-btn').classList.remove('active-state');
            document.getElementById('pause-overlay').style.display = 'none';
        }

        // --- Controls Setup ---
        document.getElementById('prev-btn').addEventListener('click', function() {
            if (playlist.length === 0) return; 
            clearInterval(timerInterval); 
            forceUnpause();
            if (currentIndex > 0) currentIndex--; 
            totalTimeRemaining = recalculateRemainingTotal(currentIndex);
            runBlock(currentIndex);
        });

        document.getElementById('next-btn').addEventListener('click', function() {
            if (playlist.length === 0 || currentIndex >= playlist.length) return;
            clearInterval(timerInterval);
            forceUnpause();
            currentIndex++;
            if (currentIndex >= playlist.length) {
                finishWorkout(); 
            } else {
                totalTimeRemaining = recalculateRemainingTotal(currentIndex);
                runBlock(currentIndex);
            }
        });

        document.getElementById('mute-btn').addEventListener('click', function() {
            isMuted = !isMuted;
            if (isMuted) {
                this.innerText = '🔇';
                this.classList.add('muted-state');
            } else {
                this.innerText = '🔊';
                this.classList.remove('muted-state');
            }
        });

        document.getElementById('pause-btn').addEventListener('click', function() {
            isPaused = !isPaused;
            if (isPaused) {
                this.innerText = '▶️';
                this.classList.add('active-state');
                document.getElementById('pause-overlay').style.display = 'flex';
            } else {
                forceUnpause();
            }
        });

        document.getElementById('modifier-btn').addEventListener('click', function() {
            showModifier = !showModifier;
            if (showModifier) {
                this.classList.add('active-state');
            } else {
                this.classList.remove('active-state');
            }
            if (playlist.length > 0) updateUI(playlist[currentIndex]);
        });

        // Fullscreen Logic
        function updateFullscreenIcon(isActive) {
            const btn = document.getElementById('fullscreen-btn');
            if (isActive) {
                btn.innerText = '✖️'; 
                btn.classList.add('active-state');
            } else {
                btn.innerText = '🔲'; 
                btn.classList.remove('active-state');
            }
        }

        document.getElementById('fullscreen-btn').addEventListener('click', function() {
            const docElm = document.documentElement;
            const container = document.getElementById('app-container');
            const isNativeFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
            const isPseudoFullscreen = container.classList.contains('pseudo-fullscreen');

            if (!isNativeFullscreen && !isPseudoFullscreen) {
                if (docElm.requestFullscreen) {
                    docElm.requestFullscreen().catch(() => { container.classList.add('pseudo-fullscreen'); updateFullscreenIcon(true); });
                } else if (docElm.webkitRequestFullscreen) {
                    try { docElm.webkitRequestFullscreen(); } catch(e) { container.classList.add('pseudo-fullscreen'); updateFullscreenIcon(true); }
                } else {
                    container.classList.add('pseudo-fullscreen'); updateFullscreenIcon(true);
                }
            } else {
                if (isNativeFullscreen) {
                    if (document.exitFullscreen) document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                }
                if (isPseudoFullscreen) { container.classList.remove('pseudo-fullscreen'); updateFullscreenIcon(false); }
            }
        });

        const handleFullscreenChange = () => {
            const isNativeFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
            const isPseudoFullscreen = document.getElementById('app-container').classList.contains('pseudo-fullscreen');
            if (!isNativeFullscreen && !isPseudoFullscreen) updateFullscreenIcon(false);
            else if (isNativeFullscreen) updateFullscreenIcon(true);
        };
        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);

        // Keyboard Shortcuts
        document.addEventListener('keydown', function(event) {
            if (playlist.length === 0) return;
            switch(event.code) {
                case 'Space': event.preventDefault(); document.getElementById('pause-btn').click(); break;
                case 'ArrowRight': event.preventDefault(); document.getElementById('next-btn').click(); break;
                case 'ArrowLeft': event.preventDefault(); document.getElementById('prev-btn').click(); break;
                case 'KeyM': document.getElementById('mute-btn').click(); break;
                case 'KeyF': document.getElementById('fullscreen-btn').click(); break;
                case 'KeyS': document.getElementById('modifier-btn').click(); break;
            }
        });

        async function init() {
            try {
                const noCache = '?t=' + new Date().getTime();
                const [exResponse, woResponse] = await Promise.all([
                    fetch(EXERCISES_URL + noCache),
                    fetch(WORKOUT_URL + noCache)
                ]);

                const exData = await exResponse.json();
                const woData = await woResponse.json();

                exData.exercises.forEach(ex => { exerciseDB[ex.id] = ex; });
                allWorkouts = woData.workouts;

                const selector = document.getElementById('workout-selector');
                allWorkouts.forEach((wo, index) => {
                    let option = document.createElement('option');
                    option.value = index;
                    option.text = wo.workoutName;
                    selector.appendChild(option);
                });
                
                if (TARGET_WORKOUT_ID !== "") {
                    const targetIndex = allWorkouts.findIndex(w => w.id === TARGET_WORKOUT_ID);
                    if (targetIndex !== -1) selector.value = targetIndex; 
                } else {
                    selector.style.display = 'block';
                }

                document.getElementById('loading-text').style.display = 'none';
                document.getElementById('start-btn').style.display = 'block';
                document.getElementById('top-controls').style.display = 'flex';
                document.getElementById('start-btn').addEventListener('click', prepareWorkout);

            } catch (error) {
                console.error("Failed to load JSON:", error);
                document.getElementById('loading-text').innerText = "Error Loading Data.";
            }
        }

        function prepareWorkout() {
            const selectedIndex = document.getElementById('workout-selector').value;
            const selectedWorkout = allWorkouts[selectedIndex];
            
            playlist = []; 
            totalTimeRemaining = 0;

            const rounds = selectedWorkout.rounds || 1;
            for (let r = 0; r < rounds; r++) {
                selectedWorkout.circuits.forEach(circuit => {
                    circuit.sequence.forEach(block => {
                        const details = exerciseDB[block.exerciseId] || { name: 'Unknown', safetyCues: '' };
                        playlist.push({
                            ...block,
                            name: details.name,
                            safetyCues: details.safetyCues,
                            roundNum: r + 1 // Save the round number for display
                        });
                        totalTimeRemaining += block.duration; 
                    });
                });
            }

            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            document.getElementById('start-overlay').style.display = 'none';
            document.getElementById('finisher-overlay').style.display = 'none';
            
            // Unhide layout elements
            document.getElementById('top-info').style.display = 'block';
            document.getElementById('timeline-wrapper').style.display = 'flex';
            document.getElementById('timer-widget').style.display = 'block';
            
            buildTimelineUI();
            runBlock(0);
        }

        // --- NEW: Generate Timeline DOM Elements ---
        function buildTimelineUI() {
            const track = document.getElementById('timeline-track');
            track.innerHTML = ''; // Clear old

            playlist.forEach((block, idx) => {
                const node = document.createElement('div');
                node.className = 'timeline-node';
                node.id = `node-${idx}`;

                const label = document.createElement('div');
                label.className = 'node-label';
                label.innerText = block.name;

                const stem = document.createElement('div');
                stem.className = 'node-stem';

                const marker = document.createElement('div');
                marker.className = 'node-marker';

                // Alternate top/bottom layout like the image
                if (idx % 2 === 0) {
                    node.classList.add('top-node');
                    node.appendChild(label);
                    node.appendChild(stem);
                    node.appendChild(marker);
                } else {
                    node.classList.add('bottom-node');
                    node.appendChild(marker);
                    node.appendChild(stem);
                    node.appendChild(label);
                }

                if(block.type === 'rest') node.classList.add('rest-node');

                track.appendChild(node);
            });
        }

        function runBlock(index) {
            if (index >= playlist.length) {
                finishWorkout();
                return;
            }

            currentIndex = index;
            const currentBlock = playlist[index];
            exerciseTimeRemaining = currentBlock.duration;

            updateUI(currentBlock);

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (isPaused) return; 

                exerciseTimeRemaining--;
                totalTimeRemaining--;
                
                if (exerciseTimeRemaining === 3 || exerciseTimeRemaining === 2 || exerciseTimeRemaining === 1) playBeep('short');
                else if (exerciseTimeRemaining === 0) playBeep('long');
                
                updateTimerDisplay(currentBlock.type);

                if (exerciseTimeRemaining <= 0) {
                    clearInterval(timerInterval);
                    runBlock(index + 1);
                }
            }, 1000);
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${s.toString().padStart(2, '0')}`;
        }
        
        function formatBigTimer(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            if (m > 0) return `${m}:${s.toString().padStart(2, '0')}`;
            return `:${s.toString().padStart(2, '0')}`;
        }

        function updateUI(block) {
            // Update Round Info
            document.getElementById('round-text').innerText = `Round ${block.roundNum}`;

            // --- Update Timeline Track Styling & Position ---
            document.querySelectorAll('.timeline-node').forEach((el, i) => {
                el.classList.remove('active', 'completed');
                if (i < currentIndex) el.classList.add('completed');
                if (i === currentIndex) el.classList.add('active');
            });

            // Slide the track. (Node width is 280px). We offset by 150 to keep it centered-left.
            const nodeWidth = 280;
            const offset = (currentIndex * nodeWidth) - 150;
            document.getElementById('timeline-track').style.transform = `translateX(-${Math.max(0, offset)}px)`;

            // Update Cues
            const cuesEl = document.getElementById('safety-cues');
            if (showModifier && block.safetyCues && block.safetyCues.trim() !== "") {
                cuesEl.innerText = `💡 ${block.safetyCues}`;
                cuesEl.style.display = 'block';
            } else {
                cuesEl.style.display = 'none';
            }

            updateTimerDisplay(block.type);
        }

        function updateTimerDisplay(type) {
            document.getElementById('total-time-display').innerText = `TOTAL: ${formatTime(Math.max(0, totalTimeRemaining))}`;
            document.getElementById('exercise-time-display').innerText = formatBigTimer(exerciseTimeRemaining);

            const timerBox = document.getElementById('timer-widget');
            timerBox.classList.remove('danger', 'warning');

            if (type === 'rest' || exerciseTimeRemaining <= 5) {
                timerBox.classList.add('danger');
            } else if (exerciseTimeRemaining <= 10) {
                timerBox.classList.add('warning');
            }
        }

        function finishWorkout() {
            document.getElementById('timeline-wrapper').style.display = 'none';
            document.getElementById('top-info').style.display = 'none';
            document.getElementById('timer-widget').style.display = 'none';
            document.getElementById('safety-cues').style.display = 'none';
            document.getElementById('finisher-overlay').style.display = 'flex';
        }

        function startFinisher(finisherId) {
            const targetIndex = allWorkouts.findIndex(w => w.id === finisherId);
            if (targetIndex !== -1) {
                document.getElementById('workout-selector').value = targetIndex;
                prepareWorkout(); 
            } else {
                alert("Hold up! Finisher workout '" + finisherId + "' not found in your JSON yet.");
            }
        }

        init();
    </script>
</body>
</html>
