<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Portal Workout Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;600&family=Roboto:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        /* Cosmic Deep Space Theme */
        body {
            /* Nebula Gradient */
            background: linear-gradient(135deg, #501d36 0%, #802e52 25%, #47326b 60%, #191c42 100%);
            color: #fff;
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Faint Starfield Layer */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 90px 40px, rgba(255,255,255,0.6), transparent),
                radial-gradient(2px 2px at 150px 120px, rgba(255,255,255,0.5), transparent),
                radial-gradient(1.5px 1.5px at 250px 90px, rgba(255,255,255,0.9), transparent),
                radial-gradient(2px 2px at 300px 200px, rgba(255,255,255,0.4), transparent);
            background-size: 350px 350px;
            opacity: 0.6;
            z-index: 0;
            pointer-events: none;
        }

        /* Abstract UI Radar Rings */
        .radar-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 1;
            pointer-events: none;
        }
        .ring-1 { width: 600px; height: 600px; top: -100px; left: -100px; }
        .ring-2 { width: 800px; height: 800px; top: -200px; left: -200px; border-style: dashed; opacity: 0.3; }
        .ring-3 { width: 300px; height: 300px; top: 10%; right: 30%; border: 1px solid rgba(255,255,255,0.05); }

        #app-container {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        /* Pseudo-Fullscreen Fallback Class */
        .pseudo-fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
            border-radius: 0 !important;
            border: none !important;
            z-index: 9999 !important;
        }

        /* --- Top Controls --- */
        #top-controls {
            position: absolute;
            top: 20px;
            right: 30px;
            z-index: 30; 
            display: flex;
            gap: 10px;
        }

        .ctrl-btn {
            background: rgba(0,0,0,0.3);
            color: #bbb;
            border: 1px solid rgba(255,255,255,0.2);
            font-size: 1.2rem;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }
        .ctrl-btn:hover { background: rgba(255,255,255,0.2); color: #fff; border-color: #fff; }
        .active-state { color: #f4a8b6 !important; border-color: #f4a8b6 !important; }

        /* --- Main Split Layout --- */
        #content-area {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 80px 80px 80px; 
        }

        /* LEFT PANE: The Portal Timer */
        #left-pane {
            width: 40%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Compass Ticks Behind Timer */
        #compass-ticks {
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: repeating-conic-gradient(from 0deg, transparent 0deg 8deg, rgba(255,255,255,0.15) 8deg 9deg);
            -webkit-mask-image: radial-gradient(transparent 65%, black 100%);
            z-index: 1;
            transform: rotate(-15deg);
        }

        #timer-portal {
            width: 380px;
            height: 260px;
            border-radius: 50% / 40%; /* Creates the distinct oval shape */
            /* Starburst/Energy Core Effect */
            background: radial-gradient(ellipse at center, #fff 0%, #7db9e8 15%, #1a1a3a 60%, #050510 100%);
            box-shadow: 0 0 50px rgba(125, 185, 232, 0.4), inset 0 0 30px #000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 10;
            border: 2px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }

        #timer-portal.warning {
            background: radial-gradient(ellipse at center, #fff 0%, #d9534f 15%, #3a1a1a 60%, #100505 100%);
            box-shadow: 0 0 50px rgba(217, 83, 79, 0.4), inset 0 0 30px #000;
        }

        #set-timer {
            font-family: 'Oswald', sans-serif;
            font-size: 10rem;
            color: #f0f0f0;
            font-weight: 600;
            letter-spacing: -2px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8), -1px -1px 0 #fff;
            line-height: 1;
            margin-left: 10px;
        }

        /* RIGHT PANE: Right-Aligned Text Stack */
        #right-pane {
            width: 55%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end; /* Right aligned like the image */
            text-align: right;
            padding-right: 20px;
        }

        #current-exercise {
            font-family: 'Oswald', sans-serif;
            font-size: 5.5rem;
            font-weight: 400;
            color: #fff;
            line-height: 1.1;
            margin: 0 0 20px 0;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-transform: uppercase;
        }

        #upcoming-preview {
            font-family: 'Roboto', sans-serif;
            font-size: 2.2rem;
            font-weight: 300;
            color: #e0e0e0;
            margin: 0 0 50px 0;
            opacity: 0.8;
        }

        #circuit-name {
            font-family: 'Oswald', sans-serif;
            font-size: 4rem;
            font-weight: 400;
            color: #f4a8b6; /* Pastel Pink */
            margin: 0 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        #round-counter {
            font-family: 'Roboto', sans-serif;
            font-size: 2rem;
            font-weight: 300;
            font-style: italic;
            color: #f4a8b6;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
        }

        .rest-text { color: #fff !important; } /* In this theme, Rest/Recovery is white, Blocks are pink */

        /* --- Safety Cues --- */
        #safety-cues {
            position: absolute;
            bottom: 110px;
            right: 80px; /* Aligned right in this theme */
            background: rgba(0, 0, 0, 0.5);
            padding: 15px 25px;
            border-right: 4px solid #f4a8b6; /* Right border */
            font-size: 1.3rem;
            color: #fff;
            max-width: 40%;
            display: none; 
            border-radius: 4px 0 0 4px;
            backdrop-filter: blur(5px);
            text-align: right;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* --- Bottom Dark Bar & Total Progress --- */
        #bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 70px;
            background: rgba(10, 10, 20, 0.8);
            width: 100%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 40px;
            box-sizing: border-box;
            border-top: 1px solid rgba(255,255,255,0.1);
            z-index: 20;
            backdrop-filter: blur(10px);
        }

        #total-progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 4px;
            background: #f4a8b6;
            width: 100%;
            transition: width 1s linear;
            box-shadow: 0 0 10px rgba(244, 168, 182, 0.8);
            z-index: 2;
        }

        .bottom-bar-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .total-label {
            color: #aaa;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #total-time-display {
            color: #fff;
            font-family: 'Oswald', sans-serif;
            font-size: 1.6rem;
            font-weight: 400;
            letter-spacing: 1px;
            background: rgba(255,255,255,0.1);
            padding: 5px 15px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* --- Overlays --- */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(25, 28, 66, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 40; text-align: center;
        }
        
        #pause-overlay {
            background: rgba(25, 28, 66, 0.85);
            z-index: 25;
            display: none;
            backdrop-filter: blur(10px);
        }
        #pause-overlay h1 {
            font-family: 'Oswald', sans-serif;
            color: #f4a8b6;
            font-size: 6rem;
            letter-spacing: 5px;
            margin: 0;
        }

        h2.loading { font-family: 'Oswald', sans-serif; color: #fff; font-size: 3rem; font-weight: 400;}
        
        button.action-btn {
            font-family: 'Roboto', sans-serif; font-size: 1.2rem; font-weight: 600;
            padding: 15px 40px; background: #f4a8b6; color: #1a0b2e;
            border: none; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
            border-radius: 4px; transition: 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        button.action-btn:hover { background: #fff; transform: translateY(-2px); }

        select {
            font-family: 'Roboto', sans-serif; font-size: 1.2rem;
            padding: 12px; margin-bottom: 30px; background: rgba(0,0,0,0.5);
            color: #fff; border: 1px solid rgba(255,255,255,0.3); border-radius: 4px; width: 80%; max-width: 400px;
        }

        /* Finisher text */
        .overlay h1 { font-family: 'Oswald', sans-serif; font-weight: 400; color: #fff; font-size: 4.5rem; margin: 0; }
        .overlay h2.sub { color: #f4a8b6; font-size: 1.5rem; font-weight: 300; margin-top: 10px; margin-bottom: 40px; text-transform: uppercase; letter-spacing: 2px;}
        .finisher-btn-group { display: flex; gap: 20px; margin-bottom: 30px; }
        .small-btn { font-size: 1rem; padding: 10px 20px; background: transparent; color: #aaa; border: 1px solid #555; border-radius: 4px; cursor: pointer; transition: 0.2s;}
        .small-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

    </style>
</head>
<body>

    <div class="radar-ring ring-1"></div>
    <div class="radar-ring ring-2"></div>
    <div class="radar-ring ring-3"></div>

    <div id="app-container">
        
        <div id="top-controls" style="display: none;">
            <button id="prev-btn" class="ctrl-btn" title="Previous / Restart (Left Arrow)">⏮️</button>
            <button id="next-btn" class="ctrl-btn" title="Skip Forward (Right Arrow)">⏭️</button>
            <button id="pause-btn" class="ctrl-btn" title="Pause (Spacebar)">⏸️</button>
            <button id="modifier-btn" class="ctrl-btn" title="Toggle Cues (S)">💪</button>
            <button id="mute-btn" class="ctrl-btn" title="Mute (M)">🔊</button>
            <button id="fullscreen-btn" class="ctrl-btn" title="Toggle Fullscreen (F)">🔲</button>
        </div>

        <div id="content-area" style="display: none;">
            
            <div id="left-pane">
                <div id="compass-ticks"></div>
                <div id="timer-portal">
                    <div id="set-timer">:00</div>
                </div>
            </div>

            <div id="right-pane">
                <h1 id="current-exercise">RECOVERY</h1>
                <h3 id="upcoming-preview">Next: Squat + Kick x 2</h3>
                
                <div style="margin-top: 20px;">
                    <h2 id="circuit-name">BLOCK A</h2>
                    <h3 id="round-counter">(SET 2 OF 6)</h3>
                </div>
            </div>

        </div>

        <div id="safety-cues"></div>

        <div id="bottom-bar" style="display: none;">
            <div id="total-progress-bar"></div>
            <div class="bottom-bar-content">
                <span class="total-label">Total Remaining</span>
                <div id="total-time-display">00:00</div>
            </div>
        </div>

        <div id="start-overlay" class="overlay">
            <h2 id="loading-text" class="loading">Loading System...</h2>
            <select id="workout-selector" style="display: none;"></select>
            <button id="start-btn" class="action-btn" style="display: none;">INITIATE</button>
        </div>

        <div id="pause-overlay" class="overlay">
            <h1>PAUSED</h1>
        </div>

        <div id="finisher-overlay" class="overlay" style="display: none;">
            <h1>Workout Complete.</h1>
            <h2 class="sub">Select an optional finisher:</h2>
            
            <div class="finisher-btn-group">
                <button class="action-btn" onclick="startFinisher('finisher_core')">3-Min Core</button>
                <button class="action-btn" onclick="startFinisher('finisher_cardio')">3-Min Cardio</button>
                <button class="action-btn" onclick="startFinisher('finisher_upper')">3-Min Upper</button>
            </div>
            
            <button onclick="location.reload()" class="small-btn">Done (Reset)</button>
        </div>

    </div>

    <script>
        const EXERCISES_URL = 'https://raw.githubusercontent.com/scottscalici/PE/main/workout/exercises.json';
        const WORKOUT_URL = 'https://raw.githubusercontent.com/scottscalici/PE/main/workout/workout_routine.json';

        // --- CONFIGURATION ---
        const TARGET_WORKOUT_ID = ""; 
        // ---------------------

        let exerciseDB = {};
        let allWorkouts = [];
        let playlist = []; 
        let currentIndex = 0;
        
        let initialTotalTime = 0; 
        let totalTimeRemaining = 0;
        let exerciseTimeRemaining = 0;
        let timerInterval;

        let isMuted = false;
        let isPaused = false;
        let showModifier = false; 
        let audioCtx;

        function playBeep(type) {
            if (isMuted || isPaused) return;
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'short') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(440, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'long') {
                oscillator.type = 'square';
                oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                oscillator.stop(audioCtx.currentTime + 0.8);
            }
        }

        function recalculateRemainingTotal(fromIndex) {
            let total = 0;
            for (let i = fromIndex; i < playlist.length; i++) {
                total += playlist[i].duration;
            }
            return total;
        }

        function forceUnpause() {
            isPaused = false;
            document.getElementById('pause-btn').innerText = '⏸️';
            document.getElementById('pause-btn').classList.remove('active-state');
            document.getElementById('pause-overlay').style.display = 'none';
        }

        // --- Controls Event Listeners ---
        document.getElementById('prev-btn').addEventListener('click', function() {
            if (playlist.length === 0) return; 
            clearInterval(timerInterval); 
            forceUnpause();
            if (currentIndex > 0) currentIndex--; 
            totalTimeRemaining = recalculateRemainingTotal(currentIndex);
            runBlock(currentIndex);
        });

        document.getElementById('next-btn').addEventListener('click', function() {
            if (playlist.length === 0 || currentIndex >= playlist.length) return;
            clearInterval(timerInterval);
            forceUnpause();
            currentIndex++;
            if (currentIndex >= playlist.length) {
                finishWorkout(); 
            } else {
                totalTimeRemaining = recalculateRemainingTotal(currentIndex);
                runBlock(currentIndex);
            }
        });

        document.getElementById('mute-btn').addEventListener('click', function() {
            isMuted = !isMuted;
            if (isMuted) {
                this.innerText = '🔇';
                this.classList.add('active-state');
            } else {
                this.innerText = '🔊';
                this.classList.remove('active-state');
            }
        });

        document.getElementById('pause-btn').addEventListener('click', function() {
            isPaused = !isPaused;
            if (isPaused) {
                this.innerText = '▶️';
                this.classList.add('active-state');
                document.getElementById('pause-overlay').style.display = 'flex';
            } else {
                forceUnpause();
            }
        });

        document.getElementById('modifier-btn').addEventListener('click', function() {
            showModifier = !showModifier;
            if (showModifier) {
                this.classList.add('active-state');
            } else {
                this.classList.remove('active-state');
            }
            if (playlist.length > 0) updateUI(playlist[currentIndex]);
        });

        // --- Fullscreen ---
        function updateFullscreenIcon(isActive) {
            const btn = document.getElementById('fullscreen-btn');
            if (isActive) {
                btn.innerText = '✖️'; 
                btn.classList.add('active-state');
            } else {
                btn.innerText = '🔲'; 
                btn.classList.remove('active-state');
            }
        }

        document.getElementById('fullscreen-btn').addEventListener('click', function() {
            const docElm = document.documentElement;
            const container = document.getElementById('app-container');
            const isNativeFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
            const isPseudoFullscreen = container.classList.contains('pseudo-fullscreen');

            if (!isNativeFullscreen && !isPseudoFullscreen) {
                if (docElm.requestFullscreen) {
                    docElm.requestFullscreen().catch(() => { container.classList.add('pseudo-fullscreen'); updateFullscreenIcon(true); });
                } else if (docElm.webkitRequestFullscreen) {
                    try { docElm.webkitRequestFullscreen(); } catch(e) { container.classList.add('pseudo-fullscreen'); updateFullscreenIcon(true); }
                } else {
                    container.classList.add('pseudo-fullscreen'); updateFullscreenIcon(true);
                }
            } else {
                if (isNativeFullscreen) {
                    if (document.exitFullscreen) document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                }
                if (isPseudoFullscreen) { container.classList.remove('pseudo-fullscreen'); updateFullscreenIcon(false); }
            }
        });

        const handleFullscreenChange = () => {
            const isNativeFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
            const isPseudoFullscreen = document.getElementById('app-container').classList.contains('pseudo-fullscreen');
            if (!isNativeFullscreen && !isPseudoFullscreen) updateFullscreenIcon(false);
            else if (isNativeFullscreen) updateFullscreenIcon(true);
        };
        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);

        document.addEventListener('keydown', function(event) {
            if (playlist.length === 0) return;
            switch(event.code) {
                case 'Space': event.preventDefault(); document.getElementById('pause-btn').click(); break;
                case 'ArrowRight': event.preventDefault(); document.getElementById('next-btn').click(); break;
                case 'ArrowLeft': event.preventDefault(); document.getElementById('prev-btn').click(); break;
                case 'KeyM': document.getElementById('mute-btn').click(); break;
                case 'KeyF': document.getElementById('fullscreen-btn').click(); break;
                case 'KeyS': document.getElementById('modifier-btn').click(); break;
            }
        });

        // --- Init & Fetch ---
        async function init() {
            try {
                const noCache = '?t=' + new Date().getTime();
                const [exResponse, woResponse] = await Promise.all([
                    fetch(EXERCISES_URL + noCache),
                    fetch(WORKOUT_URL + noCache)
                ]);

                const exData = await exResponse.json();
                const woData = await woResponse.json();

                exData.exercises.forEach(ex => { exerciseDB[ex.id] = ex; });
                allWorkouts = woData.workouts;

                const selector = document.getElementById('workout-selector');

                allWorkouts.forEach((wo, index) => {
                    let option = document.createElement('option');
                    option.value = index;
                    option.text = wo.workoutName;
                    selector.appendChild(option);
                });
                
                if (TARGET_WORKOUT_ID !== "") {
                    const targetIndex = allWorkouts.findIndex(w => w.id === TARGET_WORKOUT_ID);
                    if (targetIndex !== -1) {
                        selector.value = targetIndex; 
                        document.getElementById('loading-text').innerText = allWorkouts[targetIndex].workoutName;
                    } else {
                        document.getElementById('loading-text').innerText = "Workout ID not found!";
                    }
                } else {
                    document.getElementById('loading-text').style.display = 'none';
                    selector.style.display = 'block';
                }

                document.getElementById('start-btn').style.display = 'block';
                document.getElementById('start-btn').addEventListener('click', prepareWorkout);

            } catch (error) {
                console.error("Failed to load JSON files:", error);
                document.getElementById('loading-text').innerText = "Error Loading GitHub Data.";
            }
        }

        // --- Workout Logic ---
        function prepareWorkout() {
            const selectedIndex = document.getElementById('workout-selector').value;
            const selectedWorkout = allWorkouts[selectedIndex];
            
            playlist = []; 
            totalTimeRemaining = 0;

            let runningRoundCount = 0;
            let previousCircuitName = "";

            selectedWorkout.circuits.forEach(circuit => {
                const circuitName = circuit.circuitId || 'Circuit';
                const circuitRounds = circuit.rounds || 1; 
                
                if (circuitName !== previousCircuitName) {
                    runningRoundCount = 0; 
                    previousCircuitName = circuitName;
                }
                
                for (let r = 0; r < circuitRounds; r++) {
                    runningRoundCount++; 
                    circuit.sequence.forEach(block => {
                        const details = exerciseDB[block.exerciseId] || { name: 'Unknown', safetyCues: '' };
                        playlist.push({
                            ...block,
                            name: details.name,
                            safetyCues: details.safetyCues,
                            roundNum: runningRoundCount,
                            totalRounds: circuitRounds, // Needed for "(SET 2 OF 6)" format
                            circuitName: circuitName
                        });
                        totalTimeRemaining += block.duration; 
                    });
                }
            });

            initialTotalTime = totalTimeRemaining;

            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            document.getElementById('start-overlay').style.display = 'none';
            document.getElementById('finisher-overlay').style.display = 'none';
            
            document.getElementById('top-controls').style.display = 'flex';
            document.getElementById('content-area').style.display = 'flex';
            document.getElementById('bottom-bar').style.display = 'flex';
            
            runBlock(0);
        }

        function runBlock(index) {
            if (index >= playlist.length) {
                finishWorkout();
                return;
            }

            currentIndex = index;
            const currentBlock = playlist[index];
            exerciseTimeRemaining = currentBlock.duration;

            updateUI(currentBlock);

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (isPaused) return;

                exerciseTimeRemaining--;
                totalTimeRemaining--;
                
                if (exerciseTimeRemaining === 3 || exerciseTimeRemaining === 2 || exerciseTimeRemaining === 1) {
                    playBeep('short');
                } else if (exerciseTimeRemaining === 0) {
                    playBeep('long');
                }
                
                updateTimerDisplay(currentBlock.type);

                if (exerciseTimeRemaining <= 0) {
                    clearInterval(timerInterval);
                    runBlock(index + 1);
                }
            }, 1000);
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function formatBigTimer(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            if (m > 0) return `${m}:${s.toString().padStart(2, '0')}`;
            return `:${s.toString().padStart(2, '0')}`;
        }

        function updateUI(block) {
            // Update Right Pane Text Stack
            const currentExEl = document.getElementById('current-exercise');
            const previewEl = document.getElementById('upcoming-preview');
            
            if (block.type === 'rest') {
                currentExEl.innerText = `RECOVERY`;
            } else {
                currentExEl.innerText = block.name;
            }

            // Preview logic
            if (currentIndex + 1 < playlist.length) {
                let nextBlock = playlist[currentIndex + 1];
                let nextText = nextBlock.type === 'rest' ? `Rest (${nextBlock.duration}s)` : nextBlock.name;
                previewEl.innerText = `Next: ${nextText}`;
                previewEl.style.display = 'block';
            } else {
                previewEl.style.display = 'none';
            }

            // Circuit Info
            document.getElementById('circuit-name').innerText = block.circuitName;
            document.getElementById('round-counter').innerText = `(SET ${block.roundNum} OF ${block.totalRounds})`;

            // Safety Cues
            const cuesEl = document.getElementById('safety-cues');
            if (showModifier && block.safetyCues && block.safetyCues.trim() !== "") {
                cuesEl.innerHTML = `<strong>Note:</strong> ${block.safetyCues}`;
                cuesEl.style.display = 'block';
            } else {
                cuesEl.style.display = 'none';
            }

            updateTimerDisplay(block.type);
        }

        function updateTimerDisplay(type) {
            // Update Top Progress Bar smoothly
            const progressPct = (totalTimeRemaining / initialTotalTime) * 100;
            document.getElementById('total-progress-bar').style.width = progressPct + '%';

            // Total Bottom Timer
            document.getElementById('total-time-display').innerText = formatTime(Math.max(0, totalTimeRemaining));
            
            // Portal Set Timer
            const setTimerEl = document.getElementById('set-timer');
            setTimerEl.innerText = formatBigTimer(exerciseTimeRemaining);
            
            const timerPortal = document.getElementById('timer-portal');
            if (type === 'rest' || exerciseTimeRemaining <= 5) {
                timerPortal.classList.add('warning');
            } else {
                timerPortal.classList.remove('warning');
            }
        }

        function finishWorkout() {
            document.getElementById('top-controls').style.display = 'none';
            document.getElementById('content-area').style.display = 'none';
            document.getElementById('safety-cues').style.display = 'none';
            document.getElementById('bottom-bar').style.display = 'none';
            document.getElementById('finisher-overlay').style.display = 'flex';
        }

        function startFinisher(finisherId) {
            const targetIndex = allWorkouts.findIndex(w => w.id === finisherId);
            
            if (targetIndex !== -1) {
                document.getElementById('workout-selector').value = targetIndex;
                prepareWorkout(); 
            } else {
                alert("Finisher workout '" + finisherId + "' not found in your JSON.");
            }
        }

        init();
    </script>
</body>
</html>
