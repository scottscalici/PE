<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PE Daily Log</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { color: #0056b3; text-align: center; }
        
        .controls { text-align: center; margin-bottom: 20px; }
        .btn-toggle { background: #eee; border: none; padding: 10px 20px; font-size: 1.1em; cursor: pointer; border-radius: 5px; margin: 0 5px; }
        .btn-toggle.active { background: #0056b3; color: white; font-weight: bold; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f8f9fa; color: #555; }
        
        .date-col { width: 15%; font-weight: bold; color: #0056b3; }
        .unit-col { width: 42.5%; font-weight: bold; }
        .workout-col { width: 42.5%; }
        
        .locked { color: #999; font-style: italic; }
        .locked-icon { font-size: 0.8em; margin-left: 5px; }
        .past-date { opacity: 0.6; } 
        
        a { color: #0056b3; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h1>Daily Class Log</h1>
    
    <div class="controls">
        <button id="btnA" class="btn-toggle active" onclick="loadLog('A')">A Day Schedule</button>
        <button id="btnB" class="btn-toggle" onclick="loadLog('B')">B Day Schedule</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Day</th>
                <th>Unit</th>
                <th>Workout</th>
            </tr>
        </thead>
        <tbody id="logBody">
            <tr><td colspan="3" style="text-align: center;">Loading calendar...</td></tr>
        </tbody>
    </table>
</div>

<script>
    const CALENDAR_URL = "https://raw.githubusercontent.com/scottscalici/imagenes/main/planes/calendario.json";
    const UNIT_SCHEDULE_URL = "https://raw.githubusercontent.com/scottscalici/PE/main/unit_schedule.json"; 

    let calendarData = [];
    let scheduleData = { schedule: [], workouts: [] };

    window.onload = async () => {
        try {
            const [calRes, schedRes] = await Promise.all([
                fetch(`${CALENDAR_URL}?t=${Date.now()}`),
                fetch(`${UNIT_SCHEDULE_URL}?t=${Date.now()}`)
            ]);
            
            const calJson = await calRes.json();
            calendarData = calJson.map;
            scheduleData = await schedRes.json();
            
            loadLog('A');
        } catch (error) {
            document.getElementById('logBody').innerHTML = `<tr><td colspan="3" style="color:red;">Error loading data: ${error.message}</td></tr>`;
        }
    };

    function loadLog(cycle) {
        document.getElementById('btnA').className = cycle === 'A' ? 'btn-toggle active' : 'btn-toggle';
        document.getElementById('btnB').className = cycle === 'B' ? 'btn-toggle active' : 'btn-toggle';

        const tbody = document.getElementById('logBody');
        tbody.innerHTML = '';

        let cycleDays = calendarData.filter(d => d.ciclo === cycle && d.dia !== null);

        const todayStr = new Date().toISOString().split('T')[0]; 
        
        let upcoming = cycleDays.filter(d => d.fecha >= todayStr);
        let past = cycleDays.filter(d => d.fecha < todayStr);

        upcoming.sort((a, b) => a.fecha.localeCompare(b.fecha));
        past.sort((a, b) => a.fecha.localeCompare(b.fecha));

        const sortedDays = [...upcoming, ...past];

        const todayDateObj = new Date();
        todayDateObj.setHours(0,0,0,0);

        sortedDays.forEach(calEntry => {
            const isPast = calEntry.fecha < todayStr;
            const rowClass = isPast ? 'past-date' : '';

            // UNIT LOGIC
            let unitData = scheduleData.schedule.find(u => u.dias.includes(calEntry.dia));
            let unitName = unitData ? unitData.display_name : "TBD";
            let unitSlug = unitData ? unitData.unit_id.replace(/_/g, '-') : null;

            // WORKOUT LOGIC
            let workoutData = (scheduleData.workouts || []).find(w => w.dias && w.dias.includes(calEntry.dia));
            
            // 1. Change the default text here if there is no entry in the JSON
            let workoutName = workoutData ? workoutData.display_name : "<em>Class Warmup & Gameplay</em>";
            
            // 2. Only create a slug if a valid workout_id exists
            let workoutSlug = (workoutData && workoutData.workout_id) ? workoutData.workout_id.replace(/_/g, '-') : null;

            // 7-DAY LOCK LOGIC
            const eventDate = new Date(calEntry.fecha + 'T00:00:00'); 
            const diffTime = eventDate.getTime() - todayDateObj.getTime();
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            const isLocked = diffDays > 7;

            let unitHtml = unitName;
            let workoutHtml = workoutName;

            if (isLocked) {
                unitHtml = `<span class="locked">${unitName} <span class="locked-icon">🔒</span></span>`;
                if (workoutData) workoutHtml = `<span class="locked">${workoutName}</span>`;
            } else {
                if (unitSlug) {
                    unitHtml = `<a href="https://sites.google.com/view/uais-pe/units/${unitSlug}" target="_blank">${unitName}</a>`;
                }
                
                // 3. If there is a slug, make it a link. Otherwise, it stays as plain text!
                if (workoutSlug) {
                    workoutHtml = `<a href="https://sites.google.com/view/uais-pe/workouts/${workoutSlug}" target="_blank">${workoutName}</a>`;
                }
            }

            tbody.innerHTML += `
                <tr class="${rowClass}">
                    <td class="date-col">Day ${calEntry.dia}</td>
                    <td class="unit-col">${unitHtml}</td>
                    <td class="workout-col">${workoutHtml}</td>
                </tr>
            `;
        });
    }
</script>

</body>
</html>
